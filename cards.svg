<svg xmlns="http://www.w3.org/2000/svg" width="900" height="215" viewBox="0 0 900 215" role="img" aria-label="sobre mim, agora e foco">
  <defs>
    <clipPath id="cA"><rect x="0" y="0" width="548" height="215" rx="10"/></clipPath>
    <clipPath id="cB"><rect x="568" y="0" width="332" height="100" rx="10"/></clipPath>
    <clipPath id="cC"><rect x="568" y="115" width="332" height="100" rx="10"/></clipPath>
    <style>
      .ln { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.3 } 50% { opacity:.9 } }
      .cur { animation: cur 1.1s steps(1) infinite; }
      @keyframes cur { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
      @media (prefers-reduced-motion: reduce) { .cur,.pulse { animation:none } }
    </style>
  </defs>

  <g clip-path="url(#cA)">
    <rect x="0" y="0" width="548" height="215" fill="#0a0a0a"/>
    <rect x="0" y="0" width="548" height="30" fill="#151515"/>
    <circle cx="18" cy="15" r="4.5" fill="none" stroke="#3d3d3d" stroke-width="1.1"/>
    <circle cx="33" cy="15" r="4.5" fill="none" stroke="#5c5c5c" stroke-width="1.1"/>
    <circle class="pulse" cx="48" cy="15" r="4.5" fill="#e0e0e0"/>
    <text class="ln" x="274" y="19" text-anchor="middle" font-size="11" fill="#5c5c5c">~/about.md</text>
    <text class="ln" x="34" y="68" font-size="12" fill="#5c5c5c">&gt; sobre mim.</text>
    <text class="ln" x="34" y="118" font-size="27" font-weight="700" fill="#fafafa">Faço uns sites</text>
    <text class="ln" x="34" y="155" font-size="27" font-weight="700" fill="#8a8a8a">e procuro falhas</text>
    <rect class="cur" x="392" y="134" width="13" height="24" fill="#8a8a8a"/>
    <text class="ln" x="34" y="188" font-size="12" fill="#454545">// tudo por diversão</text>
  </g>
  <rect x="0.5" y="0.5" width="547" height="214" rx="10" fill="none" stroke="#242424"/>

  <g clip-path="url(#cB)">
    <rect x="568" y="0" width="332" height="100" fill="#0a0a0a"/>
    <rect x="568" y="0" width="332" height="26" fill="#151515"/>
    <text class="ln" x="580" y="17" font-size="11" fill="#5c5c5c">$ now</text>
    <text class="ln" x="586" y="50" font-size="11" fill="#5c5c5c">&gt; agora</text>
    <text class="ln" x="586" y="72" font-size="16" font-weight="700" fill="#fafafa">estudando </text>
    <rect x="586" y="84" width="230" height="5" rx="2.5" fill="#242424"/>
    <rect x="586" y="84" width="122" height="5" rx="2.5" fill="#d4d4d4">
      <animate attributeName="width" values="122;60;190;122" keyTimes="0;0.33;0.66;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text class="ln" x="828" y="89" font-size="10" fill="#454545">/ok</text>
  </g>
  <rect x="568.5" y="0.5" width="331" height="99" rx="10" fill="none" stroke="#242424"/>

  <g clip-path="url(#cC)">
    <rect x="568" y="115" width="332" height="100" fill="#0a0a0a"/>
    <rect x="568" y="115" width="332" height="26" fill="#151515"/>
    <text class="ln" x="580" y="132" font-size="11" fill="#5c5c5c">$ focus</text>
    <text class="ln" x="586" y="165" font-size="11" fill="#5c5c5c">&gt; meu foco</text>
    <text class="ln" x="586" y="190" font-size="14" fill="#d4d4d4">aprender e aprimorar</text>
  </g>
  <rect x="568.5" y="115.5" width="331" height="99" rx="10" fill="none" stroke="#242424"/>
</svg>
