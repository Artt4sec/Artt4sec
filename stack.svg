<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-label="ferramentas que uso">
  <defs>
    <clipPath id="s"><rect x="0" y="0" width="900" height="170" rx="10"/></clipPath>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes pop { from { opacity:0; transform: translateY(6px) } to { opacity:1; transform: translateY(0) } }
      .t1 { opacity:0; animation: pop .45s ease-out 0.17s forwards; }
      .t2 { opacity:0; animation: pop .45s ease-out 0.23s forwards; }
      .t3 { opacity:0; animation: pop .45s ease-out 0.29s forwards; }
      .t4 { opacity:0; animation: pop .45s ease-out 0.34s forwards; }
      .t5 { opacity:0; animation: pop .45s ease-out 0.40s forwards; }
      .t6 { opacity:0; animation: pop .45s ease-out 0.45s forwards; }
      .t7 { opacity:0; animation: pop .45s ease-out 0.51s forwards; }
      .t8 { opacity:0; animation: pop .45s ease-out 0.56s forwards; }
      .t9 { opacity:0; animation: pop .45s ease-out 0.61s forwards; }
      .t10 { opacity:0; animation: pop .45s ease-out 0.67s forwards; }
      .t11 { opacity:0; animation: pop .45s ease-out 0.72s forwards; }
      .t12 { opacity:0; animation: pop .45s ease-out 0.78s forwards; }
      .t13 { opacity:0; animation: pop .45s ease-out 0.83s forwards; }
      .cur { animation: cur 1.1s steps(1) infinite; }
      @keyframes cur { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
      @media (prefers-reduced-motion: reduce) { g[class^="t"] { opacity:1; animation:none } .cur { animation:none } }
    </style>
  </defs>
  <g clip-path="url(#s)">
    <rect x="0" y="0" width="900" height="170" fill="#0a0a0a"/>
    <text x="34" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#fafafa">$ ls ~/stack/</text>
    <rect class="cur" x="130" y="22" width="9" height="16" fill="#fafafa"/>
    <text x="164" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#454545">// ferramentas que uso</text>
    <g class="t1">
      <rect x="22" y="56" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="78" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">photoshop</text>
    </g>
    <g class="t2">
      <rect x="146" y="56" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="202" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">figma</text>
    </g>
    <g class="t3">
      <rect x="270" y="56" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="326" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">blender</text>
    </g>
    <g class="t4">
      <rect x="394" y="56" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="450" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">html</text>
    </g>
    <g class="t5">
      <rect x="518" y="56" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="574" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">css</text>
    </g>
    <g class="t6">
      <rect x="642" y="56" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="698" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">javascript</text>
    </g>
    <g class="t7">
      <rect x="766" y="56" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="822" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">next.js</text>
    </g>
    <g class="t8">
      <rect x="84" y="110" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="140" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">lua</text>
    </g>
    <g class="t9">
      <rect x="208" y="110" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="264" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">mysql</text>
    </g>
    <g class="t10">
      <rect x="332" y="110" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="388" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">linux</text>
    </g>
    <g class="t11">
      <rect x="456" y="110" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="512" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">bash</text>
    </g>
    <g class="t12">
      <rect x="580" y="110" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="636" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">git</text>
    </g>
    <g class="t13">
      <rect x="704" y="110" width="112" height="38" rx="6" fill="#151515" stroke="#242424"/>
      <text x="760" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c4c4c4">vs code</text>
    </g>
    <rect x="-300" y="44" width="300" height="112" fill="url(#sweep)">
      <animate attributeName="x" values="-300;900" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="899" height="169" rx="10" fill="none" stroke="#242424"/>
</svg>
