<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="artt4sec">
  <defs>
    <clipPath id="h"><rect x="0" y="0" width="900" height="250" rx="10"/></clipPath>
    <style>
      .ln { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .cur { animation: cur 1.1s steps(1) infinite; }
      @keyframes cur { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
      .r1 { opacity:0; animation: up .5s ease-out .25s forwards; }
      .r2 { opacity:0; animation: up .5s ease-out .5s forwards; }
      .r3 { opacity:0; animation: up .5s ease-out .75s forwards; }
      @keyframes up { from { opacity:0; transform: translateY(7px) } to { opacity:1; transform: translateY(0) } }
      .dot { animation: drift 7s ease-in-out infinite alternate; }
      .dot2 { animation: drift 9s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translateY(0) } to { transform: translateY(-10px) } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:.9 } }
      @media (prefers-reduced-motion: reduce) { .r1,.r2,.r3 { opacity:1; animation:none } .cur,.dot,.dot2,.pulse { animation:none } }
    </style>
  </defs>
  <g clip-path="url(#h)">
    <rect x="0" y="0" width="900" height="250" fill="#0a0a0a"/>
    <g fill="#ffffff" opacity="0.06">
      <circle class="dot" cx="690" cy="96" r="2.5"/>
      <circle class="dot2" cx="742" cy="150" r="2"/>
      <circle class="dot" cx="800" cy="112" r="1.8"/>
      <circle class="dot2" cx="836" cy="186" r="2.4"/>
      <circle class="dot" cx="628" cy="200" r="1.6"/>
      <circle class="dot2" cx="782" cy="66" r="1.4"/>
    </g>
    <rect x="0" y="0" width="900" height="38" fill="#151515"/>
    <circle cx="24" cy="19" r="6" fill="none" stroke="#3d3d3d" stroke-width="1.2"/>
    <circle cx="44" cy="19" r="6" fill="none" stroke="#5c5c5c" stroke-width="1.2"/>
    <circle class="pulse" cx="64" cy="19" r="6" fill="#e0e0e0"/>
    <text class="ln" x="450" y="24" text-anchor="middle" font-size="12" fill="#5c5c5c">artt4sec@github: ~/profile — zsh</text>
    <text class="ln r1" x="60" y="112" font-size="36" font-weight="700">
      <tspan fill="#5c5c5c">&gt;</tspan><tspan fill="#fafafa"> artt</tspan>
    </text>
    <rect class="cur" x="198" y="86" width="16" height="30" fill="#fafafa"/>
    <rect class="r1" x="60" y="128" width="58" height="2" fill="#2e2e2e"/>
    <text class="ln r2" x="64" y="162" font-size="15">
      <tspan fill="#4a4a4a">&gt; </tspan><tspan fill="#d4d4d4">gfx artist</tspan><tspan fill="#4a4a4a"> &amp; </tspan><tspan fill="#fafafa">webdesigner</tspan>
    </text>
    <text class="ln r3" x="64" y="191" font-size="15">
      <tspan fill="#4a4a4a">&gt; </tspan><tspan fill="#d4d4d4">learning </tspan><tspan fill="#fafafa" font-weight="700">websec</tspan>
    </text>
    <text class="ln r3" x="64" y="223" font-size="13" fill="#454545">// araçatuba, são paulo — br</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="249" rx="10" fill="none" stroke="#242424"/>
</svg>
